  hint: 'Писать только response.md, claims.json, decision.json в reports/mentor/MT-2026-11-13-literature-review-v2.
    claims: список {id, claim, status:supported|unverified, source_url, quote, evidence_file}.
    supported — точная цитата из sources-*.md.json, не из памяти. decision: {roadmap_change:boolean,
    report_change:boolean, reason, trigger, options:[no_change,...], owner_actions:[...]}.
    При roadmap_change нужен trigger и минимум один supported claim; не менять канонические
    документы. В response.md ссылаться на claim id и URL, разделять источник/измерено/план;
    дать ответ по каждому requirements карточки и ограничения поиска. Обязательная
    матрица decision.coverage: [{topic: точная тема research_policy.topics, claim_ids:
    [ID подтверждённых утверждений]}], по записи на каждую тему. Минимумы разных URL/доменов
    берутся из research_policy; количество не доказывает полноту. Если источников
    не хватает, не выдумывай цитаты: decision.completion_status=partial, limitations=[причины/что
    не проверено], по каждой непокрытой теме claim_ids=[] и gap=причина. В response.md
    явно напиши ЧАСТИЧНЫЙ РЕЗУЛЬТАТ и перечисли ограничения. Это сохранение материала,
    не выполнение задания; полный исход completion_status=complete.'
