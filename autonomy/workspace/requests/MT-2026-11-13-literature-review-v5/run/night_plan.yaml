    матрица decision.coverage: [{topic: точная тема research_policy.topics, claim_ids:
    [ID подтверждённых утверждений]}], по записи на каждую тему. Минимумы разных URL/доменов
    берутся из research_policy; количество не доказывает полноту. Если источников
    не хватает, не выдумывай цитаты: decision.completion_status=partial, limitations=[причины/что
    не проверено], по каждой непокрытой теме claim_ids=[] и gap=причина. В response.md
    явно напиши ЧАСТИЧНЫЙ РЕЗУЛЬТАТ и перечисли ограничения. Это сохранение материала,
    не выполнение задания; полный исход completion_status=complete.'
